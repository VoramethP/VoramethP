# ใช้กับ README-full.md: วาด contribution graph แบบ 3 มิติทุกวัน แล้ว commit ลงโฟลเดอร์ profile-3d-contrib/
name: 3d-contrib

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit the new graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "chore: update 3D contribution graph" || echo "no changes"
          git push
